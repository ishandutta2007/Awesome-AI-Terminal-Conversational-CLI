<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#06090e" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <filter id="blurFilter">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>

  <style>
    .terminal-window {
      stroke: #334155;
      stroke-width: 1.5;
      fill: #0f172a;
      fill-opacity: 0.85;
      rx: 12px;
    }
    .badge-pill {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    .main-title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .sub-title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 18px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .terminal-code {
      font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace;
      font-size: 14px;
      fill: #38bdf8;
    }
    .cursor {
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(60px, 30px) scale(1.15); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-50px, -20px) scale(1.1); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }
    .floating-orb-1 {
      animation: floatOrb1 10s ease-in-out infinite;
    }
    .floating-orb-2 {
      animation: floatOrb2 12s ease-in-out infinite;
    }
    .stream-line {
      stroke-dasharray: 8 8;
      animation: dashMove 20s linear infinite;
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 360; }
    }
  </style>

  <!-- Deep canvas background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Glowing Ambience in background -->
  <g class="floating-orb-1" filter="url(#blurFilter)">
    <circle cx="200" cy="120" r="140" fill="url(#glowGrad1)" />
  </g>
  <g class="floating-orb-2" filter="url(#blurFilter)">
    <circle cx="1020" cy="260" r="160" fill="url(#glowGrad2)" />
  </g>

  <!-- Subtle grid layout -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Animated Ambient Lines -->
  <path d="M 0 100 Q 300 240, 600 130 T 1200 200" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.25" class="stream-line" />
  <path d="M 0 320 Q 400 180, 800 300 T 1200 160" fill="none" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.2" class="stream-line" />

  <!-- Terminal Card Representation -->
  <g transform="translate(100, 45)">
    <rect class="terminal-window" x="0" y="0" width="1000" height="330" />
    
    <!-- Window controls -->
    <circle cx="24" cy="22" r="6" fill="#ef4444" />
    <circle cx="44" cy="22" r="6" fill="#eab308" />
    <circle cx="64" cy="22" r="6" fill="#22c55e" />
    
    <!-- Window Title Tab -->
    <rect x="95" y="10" width="220" height="24" rx="6" fill="#1e293b" />
    <text x="120" y="26" font-family="monospace" font-size="11" fill="#94a3b8">ai-terminal-session ⚡ zsh</text>

    <!-- Foreground Content: Header & Badges -->
    <g transform="translate(50, 75)">
      <!-- Animated status pill -->
      <rect x="0" y="0" width="160" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <circle cx="12" cy="13" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="24" y="17" class="badge-pill" font-size="11" fill="#38bdf8">AI-NATIVE TERMINAL</text>

      <rect x="175" y="0" width="165" height="26" rx="13" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
      <circle cx="187" cy="13" r="4" fill="#818cf8" />
      <text x="199" y="17" class="badge-pill" font-size="11" fill="#818cf8">CONVERSATIONAL CLI</text>

      <rect x="355" y="0" width="135" height="26" rx="13" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
      <circle cx="367" cy="13" r="4" fill="#c084fc" />
      <text x="379" y="17" class="badge-pill" font-size="11" fill="#c084fc">AGENTIC TUIS</text>

      <!-- Main Headline in Foreground -->
      <text x="0" y="72" class="main-title" fill="url(#accentGrad)">Awesome AI Terminal &amp; Conversational CLI</text>
      
      <!-- Subtitle -->
      <text x="0" y="108" class="sub-title">Curated index of AI-Native Shells, Conversational SSH Clients, Autonomous TUI Agents &amp; CLI Assistants</text>
      
      <!-- Code Prompt Line -->
      <g transform="translate(0, 140)">
        <rect x="0" y="0" width="900" height="60" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1.2" />
        <text x="20" y="35" class="terminal-code">
          <tspan fill="#a855f7">❯</tspan>
          <tspan fill="#38bdf8"> ai-cli</tspan>
          <tspan fill="#f1f5f9"> --agent run &quot;diagnose cluster latency &amp; refactor kubernetes manifests&quot;</tspan>
          <tspan fill="#38bdf8" class="cursor"> ▋</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>
